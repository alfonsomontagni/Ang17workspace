<div class="p-4">
    <div class="flex justify-center mb-8">
      <!-- Campi target (in orizzontale, centrati) -->
      <div class="grid grid-cols-3 gap-8">
        <div class="flex flex-col items-center">
          <label for="targetMetallo" class="mb-2 font-semibold">Target Metallo</label>
          <input id="targetMetallo" type="number" class="p-3 border border-gray-300 rounded" />
        </div>
        <div class="flex flex-col items-center">
          <label for="targetCristallo" class="mb-2 font-semibold">Target Cristallo</label>
          <input id="targetCristallo" type="number" class="p-3 border border-gray-300 rounded" />
        </div>
        <div class="flex flex-col items-center">
          <label for="targetDeuterio" class="mb-2 font-semibold">Target Deuterio</label>
          <input id="targetDeuterio" type="number" class="p-3 border border-gray-300 rounded" />
        </div>
      </div>
    </div>
  
    <!-- Campi produzione giornaliera (in verticale, a sinistra) -->
    <div class="flex flex-col items-start mt-8 ml-8">
      <label for="produzioneMetallo" class="mb-2 font-semibold">Produzione Metallo</label>
      <input id="produzioneMetallo" type="number" class="p-3 mb-4 border border-gray-300 rounded" />
      <label for="produzioneCristallo" class="mb-2 font-semibold">Produzione Cristallo</label>
      <input id="produzioneCristallo" type="number" class="p-3 mb-4 border border-gray-300 rounded" />
      <label for="produzioneDeuterio" class="mb-2 font-semibold">Produzione Deuterio</label>
      <input id="produzioneDeuterio" type="number" class="p-3 border border-gray-300 rounded" />
    </div>
  </div>
